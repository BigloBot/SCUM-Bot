# Bot configuration. Loaded once at startup; `/scum refresh` reloads it without a restart.
#
# Secrets (DISCORD_TOKEN) belong in the environment / .env, never in this file.
# These environment variables are used when the matching value is not set here:
#   DATABASE_PATH   -> database.path       (default "data/bot.db")

bot:
  # Discord user ids that count as bot admins everywhere, in addition to the server owner,
  # Discord administrators and the admin role set with /scum config.
  owner_ids: []

world:
  # Hex-based map regions, in the order they should be listed. Matched case-insensitively from what people type.
  hexes: []

  # Aircraft per faction, in dropdown order. A faction's own planes are what its depots stock and its pilots check
  # out; the *other* faction's planes are the kill types pilots can report shooting down.
  # `key` is what a kill report stores: never change a key once reports exist, it would orphan their history.
  # Keys must be unique across the whole world section. `label` is what a stocked plane stores, so never rename
  # one once planes exist. `description` is the dropdown hint.
  factions:
    Warden:
      vehicles:
        planes:
          - key: harbinger
            label: Harbinger
            description: Harbinger (Fighter)
          - key: welkinrive
            label: Heavy Bomber
            description: Tulka P4 Welkinrive (Heavy Bomber)
          - key: austringer
            label: Torpedo Bomber
            description: M925 Austringer Man-O-War (Torpedo Bomber)
          - key: zealot
            label: Paratrooper Transport
            description: Rinnspeir Mk. I Zealot (Paratrooper Transport)
          - key: white_raven
            label: White Raven
            description: Tulka I1.9 White Raven (SeaFighter)
    Colonial:
      vehicles:
        planes:
          - key: toxot
            label: Toxot
            description: Toxot-902 “Blind Silver” (Fighter)
          - key: harpy
            label: Harpy
            description: Daimon aK-5 “Harpy” (Heavy Fighter)
          - key: myrmidon
            label: Dive Bomber
            description: Mergo-4 “Myrmidon” (Dive Bomber)
          - key: pegasus
            label: Paratrooper Plane
            description: V-5b Pegasus (Paratrooper Plane)
          - key: tzykalia
            label: Heavy Bomber
            description: Tzykalia (Heavy Bomber)

  # Planes both factions can use. Counted into every faction's dropdown.
  shared:
    vehicles:
      planes: []
